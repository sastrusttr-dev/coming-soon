<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming Soon</title>
  <meta name="description" content="Yeni web sitemiz çok yakında burada." />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap');

    :root {
      --bg: #f2f0ea;
      --ink: #1b1a18;
      --muted: #6c665d;
      --accent: #ff6f3c;
      --accent-2: #3b82f6;
      --card: rgba(255, 255, 255, 0.72);
      --border: rgba(27, 26, 24, 0.12);
      --glow: rgba(255, 111, 60, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 10% 10%, rgba(255, 111, 60, 0.18), transparent 60%),
        radial-gradient(1000px 700px at 90% 15%, rgba(59, 130, 246, 0.18), transparent 55%),
        linear-gradient(180deg, #f7f4ee 0%, #efeae2 100%);
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, rgba(27, 26, 24, 0.05) 0, rgba(27, 26, 24, 0.05) 1px, transparent 1px, transparent 24px),
        repeating-linear-gradient(90deg, rgba(27, 26, 24, 0.04) 0, rgba(27, 26, 24, 0.04) 1px, transparent 1px, transparent 24px);
      opacity: 0.4;
      pointer-events: none;
    }

    .card {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 44px 48px;
      backdrop-filter: blur(12px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08);
      display: grid;
      gap: 36px;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      right: -120px;
      top: -140px;
      background: radial-gradient(circle, var(--glow), transparent 70%);
      opacity: 0.8;
      pointer-events: none;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
    }

    .brand h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 2vw, 2rem);
      letter-spacing: 0.2px;
    }

    .badge {
      padding: 8px 14px;
      background: rgba(27, 26, 24, 0.08);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .hero {
      display: grid;
      gap: 22px;
    }

    .hero h2 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 4vw, 3.6rem);
      line-height: 1.1;
    }

    .hero p {
      margin: 0;
      max-width: 560px;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 720px) {
      .card {
        padding: 32px 26px;
      }

      .footer {
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Sastrust</h1>
          <div class="badge">Yeni deneyim yakında</div>
        </div>
      </div>
    </header>

    <section class="hero">
      <h2>Yeni web sitemiz geliyor. Daha sade, daha hızlı, daha zarif.</h2>
      <p>
çok yakında karşnızda olacacağız      </p>
    </section>

    <footer class="footer">
      <span>2026 Sastrust. Tüm hakları saklıdır.</span>
    </footer>
  </main>

</body>
</html>
